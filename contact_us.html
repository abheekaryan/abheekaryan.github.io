<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<a href="https://abheekaryan.github.io/" style="position:fixed;top:12px;right:16px;z-index:1000;padding:6px 14px;background:#5b3cc4;color:#fff;border-radius:18px;font-family:system-ui,sans-serif;font-size:14px;font-weight:600;text-decoration:none;box-shadow:0 2px 6px rgba(0,0,0,.2)">&#8962; Home</a>
    <div class="container">
        <h1>Contact Us</h1>
        <form action="mailto:alterzehn@gmail.com" method="post" enctype="text/plain">
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

            <div class="form-group">
                <label for="message">Message:</label>
                <textarea id="message" name="message" required></textarea>
            </div>
            <div class="form-group">
                <input type="submit" value="Submit">
            </div>
        </form>
    </div>
